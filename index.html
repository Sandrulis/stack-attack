<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Stack Attack</title>
    <meta name="description" content="Push crates, fill rows, dodge the crane." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <p>Stack Attack</p>
          <small id="subtitle">Block warehouse</small>
        </div>
        <div class="hud-left">
          <div class="stat">
            <span id="score-label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span id="best-label">Best</span>
            <strong id="best">0</strong>
          </div>
        </div>
        <div class="hud-right">
          <div class="stat cranes" id="cranes" aria-label="Cranes"></div>
          <div class="top-actions">
            <button type="button" id="pause-btn" class="ghost">Pause</button>
          </div>
        </div>
      </header>

      <div class="stage">
        <canvas id="game" width="800" height="640" tabindex="0" aria-label="Stack Attack game"></canvas>
        <div id="overlay" class="overlay"></div>
        <div class="mobile-controls" id="mobile-controls">
          <div class="joystick" id="joystick" aria-label="Joystick">
            <div class="joystick-base">
              <div class="joystick-knob" id="joystick-knob"></div>
            </div>
          </div>
          <button type="button" id="jump-btn" class="jump-btn" aria-label="Jump">
            <span class="jump-btn-ring"></span>
            <svg class="jump-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 4.2 5.8 10.2a1.1 1.1 0 0 0 1.5 1.6L11 8.2V19a1.1 1.1 0 0 0 2.2 0V8.2l3.7 3.6a1.1 1.1 0 1 0 1.5-1.6L12 4.2Z"
              />
            </svg>
            <span class="jump-btn-label">Jump</span>
          </button>
        </div>
      </div>

      <p class="legend" id="legend">
        <span id="legend-move">← → walk and push</span>
        <span id="legend-jump">←/→ + Space jump / push</span>
        <span id="legend-pause">Esc pause</span>
      </p>
    </div>
    <div class="rotate-hint" id="rotate-hint">
      <p id="rotate-text">Turn your phone sideways</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
