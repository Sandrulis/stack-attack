<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Stack Attack</title>
    <meta name="description" content="Stum kastes, piepildi rindas, izvairies no telfera." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <p>Stack Attack</p>
            <small id="subtitle">Noliktavas kastes</small>
          </div>
        </div>
        <div class="hud-left">
          <div class="stat">
            <span id="score-label">Punkti</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span id="best-label">Rekords</span>
            <strong id="best">0</strong>
          </div>
        </div>
        <div class="hud-right">
          <div class="stat cranes" id="cranes" aria-label="Telferi"></div>
          <div class="top-actions">
            <button type="button" id="pause-btn" class="ghost">Pauze</button>
            <button type="button" id="lang-btn">EN</button>
          </div>
        </div>
      </header>

      <div class="stage">
        <canvas id="game" width="800" height="640" tabindex="0" aria-label="Stack Attack spēle"></canvas>
        <div id="overlay" class="overlay"></div>
        <div class="mobile-controls" id="mobile-controls">
          <div class="joystick" id="joystick" aria-label="Džoistiks">
            <div class="joystick-base">
              <div class="joystick-knob" id="joystick-knob"></div>
            </div>
          </div>
          <button type="button" id="jump-btn" class="jump-btn">Lekt</button>
        </div>
      </div>

      <p class="legend" id="legend">
        <span id="legend-move">← → iet un stumt</span>
        <span id="legend-jump">Space lekt</span>
        <span id="legend-pause">Esc pauze</span>
      </p>
    </div>
    <div class="rotate-hint" id="rotate-hint">
      <p id="rotate-text">Pagriez tālruni horizontāli</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
