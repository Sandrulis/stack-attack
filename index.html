<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>BoxDrop</title>
    <meta name="description" content="Push. Stack. Survive." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e2d7e678-7b76-4075-bcef-b7dc388d4fc4"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <p id="brand-title">BoxDrop</p>
          <small id="subtitle">Push. Stack. Survive.</small>
        </div>
        <div class="hud-left" id="hud-left" hidden>
          <div class="stat">
            <span id="score-label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span id="best-label">Best</span>
            <strong id="best">0</strong>
          </div>
        </div>
        <div class="hud-right">
          <div class="hud-cranes">
            <div class="stat cranes" id="cranes" aria-label="Cranes" hidden></div>
            <button type="button" id="mute-btn" class="ghost mute-btn" aria-pressed="false" aria-label="Mute sound">
              <svg class="mute-icon mute-icon-on" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M2 9h4l5-4v14l-5-4H2V9z" />
                <path fill="currentColor" d="M15.2 8.5v1.5a2.4 2.4 0 0 1 0 3.4v1.5a3.8 3.8 0 0 0 0-6.4z" />
                <path fill="currentColor" d="M17.8 6.6v1.6a4.2 4.2 0 0 1 0 7.6v1.6a5.6 5.6 0 0 0 0-10.8z" />
              </svg>
              <svg class="mute-icon mute-icon-off" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M2 9h4l5-4v14l-5-4H2V9z" />
                <path fill="currentColor" d="M15.8 9.8 17.6 8 23.4 13.8 21.6 15.6z" />
                <path fill="currentColor" d="M21.6 8 23.4 9.8 17.6 15.6 15.8 13.8z" />
              </svg>
            </button>
            <button type="button" id="settings-btn" class="ghost mute-btn" aria-label="Settings">
              <svg class="mute-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M10.2 2h3.6l.5 2.4c.6.2 1.2.5 1.7.9l2.3-.9 1.8 3.1-1.9 1.4c.2.6.3 1.2.3 1.8s-.1 1.2-.3 1.8l1.9 1.4-1.8 3.1-2.3-.9c-.5.4-1.1.7-1.7.9L13.8 22h-3.6l-.5-2.4c-.6-.2-1.2-.5-1.7-.9l-2.3.9-1.8-3.1 1.9-1.4c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8L2.9 7.5l1.8-3.1 2.3.9c.5-.4 1.1-.7 1.7-.9L10.2 2zM12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2z"
                />
              </svg>
            </button>
          </div>
          <div class="top-actions">
            <div class="hud-action-btns">
              <button type="button" id="board-btn" class="ghost">Scores</button>
              <button type="button" id="pause-btn" class="ghost">Pause</button>
            </div>
            <div class="hud-lives-wrap" id="hud-lives-wrap" hidden>
              <span class="life-timer" id="life-timer" hidden></span>
              <div class="hud-lives" id="lives" aria-label="Lives"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="stage">
        <canvas id="game" width="800" height="640" tabindex="0" aria-label="BoxDrop game"></canvas>
        <div id="overlay" class="overlay"></div>
        <div class="mobile-controls" id="mobile-controls">
          <div class="joystick" id="joystick" aria-label="Joystick">
            <div class="joystick-base">
              <div class="joystick-knob" id="joystick-knob"></div>
            </div>
          </div>
          <button type="button" id="jump-btn" class="jump-btn" aria-label="Jump">
            <span class="jump-btn-ring"></span>
            <svg class="jump-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 4.2 5.8 10.2a1.1 1.1 0 0 0 1.5 1.6L11 8.2V19a1.1 1.1 0 0 0 2.2 0V8.2l3.7 3.6a1.1 1.1 0 1 0 1.5-1.6L12 4.2Z"
              />
            </svg>
            <span class="jump-btn-label">Jump</span>
          </button>
        </div>
      </div>

      <p class="legend" id="legend">
        <span id="legend-move">← → walk and push</span>
        <span id="legend-jump">←/→ + Space jump / push</span>
        <span id="legend-pause">Esc pause</span>
      </p>
    </div>
    <div class="rotate-hint" id="rotate-hint">
      <p id="rotate-text">Turn your phone sideways</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
