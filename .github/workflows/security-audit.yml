name: Security audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        run: npm run audit:check
